<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabel Rumus Saldo Awal Kas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }

        table {
            border-collapse: collapse;
            width: 400px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }

        .header-row {
            background-color: #00FF00;
            text-align: center;
            font-weight: bold;
        }

        .data-row {
            background-color: #FFD700;
        }

        .total-row {
            background-color: #DAA520;
            font-weight: bold;
        }

        .diff-row {
            background-color: #FF0000;
            color: white;
            font-weight: bold;
        }
    </style>
</head>
<body>

<table>
    <tr class="header-row">
        <td colspan="2">RUMUS SALDO AWAL KAS</td>
    </tr>
    <tr class="data-row">
        <td>SALDO AKHIR</td>
        <td></td>
    </tr>
    <tr class="data-row">
        <td>DANA CANCEL</td>
        <td></td>
    </tr>
    <tr class="data-row">
        <td>TOTAL BIAYA</td>
        <td></td>
    </tr>
    <tr class="total-row">
        <td>SALDO AWAL</td>
        <td>
            <input type="text" value="=N42+N43+N44" style="width:100%; box-sizing:border-box; border:none; background:transparent; font-weight:bold; font-family:inherit; color:inherit; padding:0;">
        </td>
    </tr>
    <tr class="diff-row">
        <td>SELISIH</td>
        <td>
            <input type="text" value="=N45-N51" style="width:100%; box-sizing:border-box; border:none; background:transparent; font-weight:bold; font-family:inherit; color:inherit; padding:0;">
        </td>
    </tr>
    <tr class="data-row">
        <td>SALDO BANK</td>
        <td></td>
    </tr>
    <tr class="data-row">
        <td>DANA PENDINGAN</td>
        <td></td>
    </tr>
    <tr class="total-row">
        <td>SALDO AWAL</td>
        <td>
            <input type="text" value="=N49-N50" style="width:100%; box-sizing:border-box; border:none; background:transparent; font-weight:bold; font-family:inherit; color:inherit; padding:0;">
        </td>
    </tr>
</table>

</body>
</html>
