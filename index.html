<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Rumus Saldo Awal Kas Kosong</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }

        table {
            border-collapse: collapse;
            width: 450px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            background-color: #ffffff;
        }

        th, td {
            border: 1px solid #000000;
            padding: 8px 12px;
            font-size: 14px;
        }

        /* Baris Header */
        .header-row {
            background-color: #00FF00;
            text-align: center;
            font-weight: bold;
            color: #000000;
        }

        /* Baris Input Data Standar (Kuning) */
        .data-row {
            background-color: #FFD700;
        }

        /* Baris Total / Hasil Rumus (Goldenrod / Kuning Gelap) */
        .total-row {
            background-color: #DAA520;
            font-weight: bold;
        }

        /* Baris Selisih (Merah) */
        .diff-row {
            background-color: #FF0000;
            color: #ffffff;
            font-weight: bold;
        }

        /* Styling Input Angka agar menyatu dengan sel dan mendukung format ribuan */
        input.editable-input {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            font-size: 14px;
            font-family: Arial, sans-serif;
            color: #000000;
            box-sizing: border-box;
            padding: 0;
            margin: 0;
            text-align: left;
        }

        /* Teks hasil perhitungan */
        .result-text {
            display: inline-block;
            width: 100%;
            text-align: left;
        }
        
        .negative-val {
            color: #D8000C;
        }
    </style>
</head>
<body>

<table>
    <!-- Baris Judul -->
    <tr class="header-row">
        <td colspan="2">RUMUS SALDO AWAL</td>
    </tr>

    <!-- Baris Input 1 -->
    <tr class="data-row">
        <td>SALDO AKHIR</td>
        <td><input type="text" id="saldo_akhir" class="editable-input" value="" placeholder="" oninput="hitung()"></td>
    </tr>
    <!-- Baris Input 2 -->
    <tr class="data-row">
        <td>DANA CANCEL</td>
        <td><input type="text" id="dana_cancel" class="editable-input" value="" placeholder="" oninput="hitung()"></td>
    </tr>
    <!-- Baris Input 3 (Total Biaya - Nilai Minus di dalam kurung) -->
    <tr class="data-row">
        <td>TOTAL BIAYA</td>
        <td><input type="text" id="total_biaya" class="editable-input negative-val" value="" placeholder="" oninput="hitung()"></td>
    </tr>

    <!-- Hasil Total 1 -->
    <tr class="total-row">
        <td>SALDO AWAL</td>
        <td><span id="res_saldo_awal_1" class="result-text">0</span></td>
    </tr>

    <!-- Baris Kosong Interaktif sesuai Gambar -->
    <tr class="data-row">
        <td></td>
        <td><input type="text" id="extra_input_1" class="editable-input" value="" oninput="hitung()"></td>
    </tr>

    <!-- Hasil Selisih -->
    <tr class="diff-row">
        <td>SELISIH</td>
        <td><span id="res_selisih" class="result-text">0</span></td>
    </tr>

    <!-- Baris Kosong Interaktif kedua sesuai Gambar -->
    <tr class="data-row">
        <td></td>
        <td><input type="text" id="extra_input_2" class="editable-input" value="" oninput="hitung()"></td>
    </tr>

    <!-- Baris Input 4 -->
    <tr class="data-row">
        <td>SALDO BANK</td>
        <td><input type="text" id="saldo_bank" class="editable-input" value="" placeholder="" oninput="hitung()"></td>
    </tr>
    <!-- Baris Input 5 -->
    <tr class="data-row">
        <td>DANA PENDINGAN</td>
        <td><input type="text" id="dana_pendingan" class="editable-input" value="" placeholder="" oninput="hitung()"></td>
    </tr>

    <!-- Hasil Total 2 -->
    <tr class="total-row">
        <td>SALDO AWAL</td>
        <td><span id="res_saldo_awal_2" class="result-text">0</span></td>
    </tr>
</table>

<script>
    function formatNumber(num) {
        if (isNaN(num)) return "0";
        let isNeg = num < 0;
        let absNum = Math.abs(num);
        let formatted = absNum.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        return isNeg ? "(" + formatted + ")" : formatted;
    }

    function parseValue(valStr) {
        if (!valStr) return 0;
        let cleanStr = valStr.trim();
        let isNeg = false;
        if (cleanStr.startsWith("(") && cleanStr.endsWith(")")) {
            isNeg = true;
            cleanStr = cleanStr.substring(1, cleanStr.length - 1);
        }
        cleanStr = cleanStr.replace(/,/g, "");
        let num = parseFloat(cleanStr);
        if (isNaN(num)) return 0;
        return isNeg ? -num : num;
    }

    function hitung() {
        let saldoAkhir = parseValue(document.getElementById('saldo_akhir').value);
        let danaCancel = parseValue(document.getElementById('dana_cancel').value);
        let totalBiaya = parseValue(document.getElementById('total_biaya').value);
        
        let saldoAwal1 = saldoAkhir + danaCancel + totalBiaya;
        document.getElementById('res_saldo_awal_1').innerText = formatNumber(saldoAwal1);

        let saldoBank = parseValue(document.getElementById('saldo_bank').value);
        let danaPendingan = parseValue(document.getElementById('dana_pendingan').value);
        let saldoAwal2 = saldoBank - danaPendingan;
        document.getElementById('res_saldo_awal_2').innerText = formatNumber(saldoAwal2);

        let selisih = saldoAwal1 - saldoAwal2;
        document.getElementById('res_selisih').innerText = formatNumber(selisih);
    }
</script>

</body>
</html>
